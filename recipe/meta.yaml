{% set name = "scylla-driver" %}
{% set version = "3.29.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 56dbae56ec5d079227b1b713e076b57df0fe515a848abd3ab9c152acc48f9b9d

build:
  script: {{ PYTHON }} -m pip install . -vv
  number: 1
  script_env:
    - CASS_DRIVER_BUILD_EXTENSIONS_ARE_MUST=yes # [not win]

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython                                 # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
  host:
    - python
    - cython
    - pip
    - setuptools >=70
    - lz4-c
    - libev                                 # [not win]
  run:
    - python
    - geomet >=1.1
    - pyyaml >5.0

test:
  imports:
    - cassandra
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/scylladb/python-driver
  summary: Scylla Driver for Apache Cassandra
  dev_url: https://github.com/scylladb/python-driver/
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - cclinet
